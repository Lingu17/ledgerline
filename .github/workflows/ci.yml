name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r backend/requirements-lock.txt
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install --require-hashes -r backend/requirements-lock.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm run e2e
        working-directory: frontend
  postgres:
    # Real PostgreSQL 17 (Supabase runs 17): the storage adapter, advisory locking, migrations,
    # concurrency and the whole suite with every app on PostgreSQL. No secrets: a throwaway service container.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LEDGERLINE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes -r backend/requirements-lock.txt
      - name: PostgreSQL-specific tests
        run: python -m pytest -v tests/test_postgres.py --junitxml=pg-specific.xml || python ../scripts/ci_annotate.py pg-specific.xml
        working-directory: backend
      - name: Whole suite on PostgreSQL
        run: python -m pytest -q -p no:cacheprovider --junitxml=pg-report.xml || python ../scripts/ci_annotate.py pg-report.xml
        working-directory: backend
        env:
          LEDGERLINE_TEST_ALL_ON_POSTGRES: "1"
