# Existing Render FREE API + external Neon FREE direct PostgreSQL + Vercel Hobby frontend.
# All durable tenant/domain/bank state and encrypted signing identities live in PostgreSQL.
# This file describes the intended main-branch release; do not create a duplicate service.
# Preserve the existing LEDGERLINE_SECRET_KEY and LEDGERLINE_EDGE_SECRET in the dashboard.
# sync:false never includes credential values in source and preserves existing service values on sync.
services:
  - type: web
    name: ledgerline-api
    runtime: python
    plan: free
    branch: main
    region: singapore
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements-lock.txt
    # Migrations run at startup (control plane on boot, tenant schema on first open).
    startCommand: python -m ledgerline
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: LEDGERLINE_HOST
        value: 0.0.0.0
      - key: LEDGERLINE_REQUIRE_DATABASE
        value: "1"
      - key: LEDGERLINE_DATABASE_URL
        sync: false
      - key: LEDGERLINE_SECRET_KEY
        sync: false
      - key: LEDGERLINE_EDGE_SECRET
        sync: false
      - key: LEDGERLINE_PG_SCHEMA_PREFIX
        value: ll
      - key: LEDGERLINE_COOKIE_SECURE
        value: "1"
      # Browser -> Vercel edge -> Render proxy -> app: the client address is 2 hops from the socket peer.
      - key: LEDGERLINE_TRUSTED_PROXY_HOPS
        value: "2"
      - key: LEDGERLINE_LOG_LEVEL
        value: INFO
      - key: LEDGERLINE_ALLOW_SIGNUP
        value: "1"
      # Set to the public Vercel origin (no trailing slash) after the frontend is created.
      - key: LEDGERLINE_ALLOWED_ORIGINS
        sync: false
      - key: LEDGERLINE_PUBLIC_URL
        sync: false
      # Optional integrations. Leave unset until real credentials exist; the UI labels them unavailable.
      - key: AIRWALLEX_CLIENT_ID
        sync: false
      - key: AIRWALLEX_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LEDGERLINE_SANDBOX_ORGS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
